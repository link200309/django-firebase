{% extends 'layouts/home.html'%} {% block content %}

<div class="tablon">
  <h1>Tablon de tareas</h1>
    {% for tarea in tareas %}

    <div class="card">
      <h3>{{tarea.titulo}}</h3>
      <p>Curso: {{tarea.curso.nombre}}</p>
      <p>fecha publicado: {{tarea.fecha_publicado}}</p>
      <p>fechal limite: {{tarea.fecha_limite}}</p>
      <p>{{tarea.descripcion}}</p>
      <button>Enviar Tarea</button>
      <a href="{% url 'chatear' idUser=idUser idDocente=tarea.curso.docente.id %}"
        ><button>Mensajear docente</button></a
      >
    </div>

    {% endfor %}
</div>

{% endblock %}
